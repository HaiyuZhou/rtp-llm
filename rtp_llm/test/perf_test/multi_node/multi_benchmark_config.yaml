# RTP-LLM Multi-Benchmark Configuration
# This file defines various benchmark configurations for distributed inference testing

experiment_name: "H20_Node4"

test_config:
  num_retry_times: 3
  build_from_scratch: 2
  copy_test_result: true

machine_config:
  ip_lists:
    - "33.105.178.103"
    - "33.110.169.117"
    - "33.105.178.172"
    - "33.105.47.221"
  run_user: "admin"
  ssh_port: 2222

build_config:
  git_repo_url: "git@gitlab.alibaba-inc.com:foundation_models/RTP-LLM.git"
  git_checkout_ref: "origin/main-internal"
  # open_source_url: "git@github.com:alibaba/rtp-llm.git"
  open_source_ref: "origin/main"
  ft_sub_dir: "rtp_llm_perf_test"
  bazel_build_args: '" --jobs 64 --verbose_failures --config=cuda13 "'

common_config:
  warm_up: true
  act_type: "bf16"
  hack_layer_num: 4
  start_port: 12333
  max_context_batch_size: 1
  reserver_runtime_mem_mb: 0

# Supply these normalized decode JSON configs before launching. Paths are
# relative to this YAML file. Each config owns its workload and engine bounds
# and must declare the matching TP/DP/PP/EP topology shown below.
benchmarks:
  - benchmark_name: "H20_Deepseek-R1_Decode_TP1_DP32_EP32_4K"
    fixed_config: &decode_config
      perf_test_config: "./configs/deepseek_decode_tp1_dp32.json"
      git_repo_url: "git@github.com:alibaba/rtp-llm.git"
      git_checkout_ref: "origin/feature/multi_benchmark"
      ip_lists:
        - "33.126.67.231"
        - "33.126.67.17"
        - "33.126.51.159"
        - "33.126.83.168"
      run_user: "admin"
      ssh_port: 2222
      tokenizer_path: "/mnt/nas1/hf/deepseek_r1_4layers/"
      checkpoint_path: "/mnt/nas1/hf/deepseek_r1_4layers/"
      model_type: "deepseek3"
      tp_size: 1
      dp_size: 32
      pp_size: 1
      ep_size: 32
      bazel_build_args: '" --jobs 100 --verbose_failures --config=cuda13 "'
      ft_sub_dir: "rtp_llm_perf_test"
      start_port: 12333
      accl_dispatch_num_warp_groups: 4
      accl_combine_num_warp_groups: 4
      warm_up: 1
      act_type: "bf16"
      weight_type: "fp16"
      reserver_runtime_mem_mb: 0
      max_context_batch_size: 1
      enable_merge_w13: true
      use_deepep_moe: true
      enable_layer_micro_batch: 2
      enable_comm_overlap: true
      redundant_expert: 0
      accl_low_latency_optimize: 1
  - benchmark_name: "H20_Deepseek-R1_Decode_TP2_DP16_EP32_4K"
    fixed_config:
      <<: *decode_config
      perf_test_config: "./configs/deepseek_decode_tp2_dp16.json"
      tp_size: 2
      dp_size: 16
  - benchmark_name: "H20_Deepseek-R1_Decode_TP4_DP8_EP32_4K"
    fixed_config:
      <<: *decode_config
      perf_test_config: "./configs/deepseek_decode_tp4_dp8.json"
      tp_size: 4
      dp_size: 8
